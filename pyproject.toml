[project]
name = "qmx"
version = "0.0.0"
description = "Query Memory indeX — local, private, Qwen-powered semantic search over code and chats"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    # Cap below 2.0: the 2.x SDK dropped `mcp.server.fastmcp`, so `qmx serve` dies with
    # ModuleNotFoundError. uv.lock pins 1.x for dev/CI, but `uv tool install` resolves fresh and
    # ignores the lock — without this cap every fresh install ships a server that cannot start.
    "mcp>=1.2,<2",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "watchdog>=4.0",
]

[project.scripts]
qmx = "qmx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmx"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: needs a live Ollama backend (QMX_OLLAMA_URL); skipped when unreachable",
]
